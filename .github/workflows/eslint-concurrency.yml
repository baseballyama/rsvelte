# Peak memory and wall time of the ESLint CLI with each `--concurrency`, on the components and
# rules of lint-versus-main's ESLint arm; tools/performance/workloads/eslint-concurrency/README.md.
name: ESLint concurrency

on:
  push:
    branches: [perf/eslint-concurrency-memory]

permissions:
  contents: read

concurrency:
  group: eslint-concurrency-${{ github.ref }}
  cancel-in-progress: true

env:
  W: tools/performance/workloads/eslint-concurrency
  # The tree whose ESLint run `excluded.tsv` and `rules.txt` come from.
  BASE: 9c43cd8ed0880ecc600d5a000b3357c3cc100722

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        concurrency: ['off', '1', '2', '4', '8', '16', 'auto']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BASE }}
          path: .base
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            corpus/svelte
            tools/oracle/pack.ts
            tools/performance/workloads/lint-versus-main/stage.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      - run: node .base/tools/performance/workloads/lint-versus-main/stage.ts "$RUNNER_TEMP/stage"
      - run: node "$W/prepare.ts" "$RUNNER_TEMP/stage"
      - name: Measure
        env:
          LABEL: ${{ matrix.os }}
          VALUE: ${{ matrix.concurrency }}
        run: node "$W/measure.ts" run "$RUNNER_TEMP/stage" "results/$VALUE" "$VALUE" 3 "$LABEL"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}-${{ matrix.concurrency }}
          path: results/
          if-no-files-found: ignore

  report:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - run: |
          shopt -s nullglob
          node "$W/measure.ts" report downloaded/results-*/* > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eslint-concurrency-report
          path: |
            report.md
            downloaded/
