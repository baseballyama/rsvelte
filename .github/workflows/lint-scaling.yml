# Lint time against thread count on one 16 vCPU Blacksmith runner, for main, this branch and
# ESLint. It reuses the arms that lint-versus-main built, and lints every 8th real-project
# component so the run stays small on the free minutes.
name: Lint scaling

on:
  push:
    branches: [perf/lint-scaling]

permissions:
  contents: read
  actions: read

concurrency:
  group: lint-scaling
  cancel-in-progress: true

env:
  W: tools/performance/workloads/lint-versus-main
  ARMS_RUN: '43547154286'

jobs:
  eslint:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arms-ubuntu-24.04
          path: bin
          run-id: ${{ env.ARMS_RUN }}
          github-token: ${{ github.token }}
      - run: chmod +x bin/*-arm
      - run: node "$W/stage.ts" "$RUNNER_TEMP/stage"
      # Real-project components only, every 8th, so ESLint's single-thread rounds stay short.
      - run: |
          awk '!/\/files\/rsvelte/ && (n++ % 8 == 0)' "$RUNNER_TEMP/stage/inputs.txt" > "$RUNNER_TEMP/small.txt"
          wc -l < "$RUNNER_TEMP/small.txt"
          nproc
          lscpu
      - name: Measure
        run: |
          M=(node "$W/measure.ts")
          A=(--main bin/main-arm --experimental bin/experimental-arm --eslint "$W/eslint.ts" --out results)
          "${M[@]}" platform "${A[@]}" --main-revision "$(cat bin/main-revision)" \
            --experimental-revision "$(cat bin/experimental-revision)" --label blacksmith-16vcpu
          "${M[@]}" universe "${A[@]}"
          "${M[@]}" check "${A[@]}" --inputs "$RUNNER_TEMP/small.txt" --sample 20
          "${M[@]}" wall "${A[@]}" --repetitions 2 --rounds 3 --threads 1,4,8,16 --allocators system
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-eslint-blacksmith-16vcpu
          path: results/
          if-no-files-found: ignore
