name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Include the default events plus `labeled` so adding the `coverage`
    # label to an existing PR (re-)triggers the workflow. The job's `if:`
    # below short-circuits when the label isn't present, so unlabeled PRs
    # cost nothing beyond GitHub's free event scheduling.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by the head branch on a PR (a new push supersedes the old run) and by
  # the commit otherwise, so a push to `main` shares a group with nothing and
  # cannot be cancelled. The previous guard — `cancel-in-progress:
  # ${{ github.ref != 'refs/heads/main' }}` — did not hold: every `main` run
  # under it was still cancelled the instant the next merge started, so `main`
  # never produced a verdict. The cost is one run per merge instead of one per
  # burst; a branch with no verdict reads exactly like a green one, which is
  # how a stale ratchet reached `main` unnoticed (#2435/#2593).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  # Without this the coverage trend line records only whichever merge was last.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run unconditionally on push-to-main and manual dispatch. On PRs run
    # only when the author opts in by labeling the PR `coverage` —
    # llvm-cov instrumentation roughly doubles test runtime and the
    # report is rarely actionable per-PR, so the default is to skip it.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'coverage'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Free runner disk
        # Measured, not inferred: this job fails with
        #   rustc-LLVM ERROR: IO failure on output stream: No space left on device
        # `cargo llvm-cov --workspace` links every test target in the workspace
        # with instrumentation, and rsvelte_core alone declares 589 of them.
        # The df lines stay so the next failure is sized rather than guessed at.
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h / /mnt || true

      - name: Checkout test submodules (shallow)
        run: git submodule update --init --checkout --depth 1 submodules/svelte submodules/svelte.dev submodules/language-tools submodules/eslint-plugin-svelte submodules/esrap submodules/svelte-switch-case submodules/svelte-preprocess-sass

      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: 'true'
          cache-dependency-path: |
            submodules/svelte/pnpm-lock.yaml
            submodules/language-tools/pnpm-lock.yaml

      - name: Resolve Svelte submodule SHA
        id: svelte-sha
        shell: bash
        run: echo "sha=$(git submodule status submodules/svelte | awk '{print $1}' | sed 's/^[+-]//')" >> "$GITHUB_OUTPUT"

      - name: Cache fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures
          key: fixtures-${{ runner.os }}-${{ steps.svelte-sha.outputs.sha }}-${{ hashFiles('.gitmodules', 'scripts/fixtures/generate-fixtures.mjs') }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Svelte compiler build
        # See the matching step in `.github/workflows/ci.yml`.
        id: svelte-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            submodules/svelte/node_modules
            submodules/svelte/packages/svelte/node_modules
            submodules/svelte/packages/svelte/compiler/index.js
            submodules/svelte/packages/svelte/types
            submodules/svelte/packages/svelte/*.d.ts
            submodules/svelte/packages/svelte/scripts/_bundle.js
          key: svelte-build-v2-${{ runner.os }}-${{ steps.svelte-sha.outputs.sha }}-${{ hashFiles('submodules/svelte/pnpm-lock.yaml') }}

      - name: Build Svelte compiler
        if: steps.svelte-build-cache.outputs.cache-hit != 'true'
        run: |
          cd submodules/svelte
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install language-tools deps
        # See .github/workflows/ci.yml for why the svelte-check golden
        # test needs language-tools' workspace symlinks (node_modules/svelte
        # in particular).
        run: |
          cd submodules/language-tools
          pnpm install --frozen-lockfile

      - name: Generate fixtures
        run: pnpm run generate-fixtures
        timeout-minutes: 15

      - name: Generate coverage
        # `cargo llvm-cov --workspace` links every instrumented test binary and
        # keeps them all until it reports, so peak disk is the SUM over every
        # test target in the workspace — the large majority of them
        # rsvelte_core's — and the runner's disk is not enough (#4474).
        # Reporting per batch and reclaiming after each makes the peak the MAX
        # over batches. The step prints its own counts; they are not written
        # here, because a target count only ever grows.
        # `CARGO_PROFILE_DEV_DEBUG` is deliberately not set: cargo-llvm-cov
        # already pins `-C debuginfo=line-tables-only` and overrides the profile
        # in both directions, measured on 0/2/line-tables-only.
        run: |
          set -euo pipefail
          ( while true; do printf 'DISK %s ' "$(date -u +%H:%M:%S)"; df -h / | tail -1; sleep 30; done ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT

          mkdir -p cov
          # A restored target cache can carry stale counters; clean once, then
          # own the reclamation ourselves for the rest of the job.
          cargo llvm-cov clean --workspace

          reclaim() {
            # Test executables only. `.rlib`/`.rmeta`/`.so` stay so the next
            # batch reuses the dependency build instead of recompiling it.
            find target/llvm-cov-target/debug/deps -maxdepth 1 -type f -perm -u+x \
              ! -name '*.so' ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' -delete 2>/dev/null || true
            rm -f target/llvm-cov-target/*.profraw
            df -h / | tail -1
          }

          run() {
            label=$1; shift
            cargo llvm-cov --no-clean --lcov --output-path "cov/${label}.info" \
              --ignore-filename-regex '(tests/|benches/|src/bin/)' "$@" -- --test-threads=2
            reclaim
          }

          # Disjoint by construction: everything except rsvelte_core in one
          # batch, then rsvelte_core's lib, then its test targets in batches.
          run rest --workspace --exclude rsvelte_core
          run core-lib -p rsvelte_core --lib --bins

          # Derived, not transcribed: a new rsvelte_core test target is picked up
          # without editing this file.
          # `read` rather than `mapfile`: the loop is identical on bash 3.2, so
          # this step can be dry-run outside CI. The `|| [ -n "$t" ]` arm keeps
          # the last element when a producer omits its trailing newline.
          CORE=()
          while IFS= read -r t || [ -n "$t" ]; do
            [ -n "$t" ] && CORE+=("$t")
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="rsvelte_core") | .targets[] | select(.kind==["test"]) | .name' | sort)
          # An empty or truncated enumeration would report a partial measurement
          # and exit 0, which reads exactly like full coverage.
          if [ "${#CORE[@]}" -lt 500 ]; then
            echo "rsvelte_core test enumeration returned ${#CORE[@]}, expected >=500; refusing to publish a partial report"
            exit 1
          fi
          echo "rsvelte_core integration test targets: ${#CORE[@]}"

          BATCH=100
          i=0; n=0
          while [ "$i" -lt "${#CORE[@]}" ]; do
            n=$((n + 1))
            args=()
            for t in "${CORE[@]:$i:$BATCH}"; do args+=(--test "$t"); done
            echo "=== batch $n: ${#args[@]} args starting at $i ==="
            run "core-${n}" -p rsvelte_core "${args[@]}"
            i=$((i + BATCH))
          done

          # Concatenated lcov: each batch emits complete `SF:`/`end_of_record`
          # records, and both Codecov and lcov read a stream of them. A file
          # covered by several batches appears once per batch, which is how its
          # counters get summed rather than replaced.
          # The explicit `echo` is load-bearing: cargo-llvm-cov's lcov output
          # ends WITHOUT a trailing newline, so a plain `cat` welds one batch's
          # `end_of_record` onto the next batch's `SF:` and silently loses a
          # record per boundary while still exiting 0.
          for f in cov/*.info; do cat "$f"; echo; done > lcov.info
          test -s lcov.info
          sf=$(grep -c '^SF:' lcov.info)
          eor=$(grep -c '^end_of_record' lcov.info)
          echo "batches=$(ls -1 cov/*.info | wc -l) SF=${sf} end_of_record=${eor}"
          # A welded boundary shows up here and nowhere else in the job.
          if [ "$sf" -ne "$eor" ]; then
            echo "lcov.info has ${sf} SF records against ${eor} end_of_record; a record boundary was corrupted"
            exit 1
          fi
        env:
          RUST_MIN_STACK: '33554432'
          # Match CI's tsc pin; see .github/workflows/ci.yml for the
          # background on why we point at the svelte submodule's TS 5.x.
          TSGO_BIN: ${{ github.workspace }}/submodules/svelte/node_modules/.bin/tsc

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-coverage
          path: lcov.info
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
