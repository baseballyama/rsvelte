name: Changeset Gate

# Split out of ci.yml so the extra `labeled` / `unlabeled` trigger types don't
# re-run the whole (expensive) CI workflow every time a label is added or
# removed. This job only needs a git checkout + Node script, so re-running it
# on a label event is cheap; re-running `test` / `clippy` /
# `compatibility-report` / `language-server` etc. on the same event would not
# be. See #1817: adding the label after `gh pr create` used to never
# re-trigger the gate, since the default `pull_request` trigger types
# (`opened`/`synchronize`/`reopened`) don't include `labeled`.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    # Conventional-commit `fix` / `feat` PRs are user-facing changes that
    # must ship a changeset so the Release workflow can version + changelog
    # them. Other types (chore, docs, refactor, test, ci, build, perf…) are
    # exempt. Add the `skip-changeset` label to bypass for a one-off.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require changeset for fix/feat PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SKIP" == "true" ]]; then
            echo "skip-changeset label present — skipping changeset requirement."
            exit 0
          fi

          # Only `fix` / `feat` (optionally scoped and/or breaking `!`) require a changeset.
          if [[ ! "$PR_TITLE" =~ ^(fix|feat)(\([^\)]*\))?!?: ]]; then
            echo "PR title '$PR_TITLE' is not a fix/feat change — changeset not required."
            exit 0
          fi

          # Diff against the actual merge-base with main, not
          # github.event.pull_request.base.sha: that field is fixed at PR-open
          # (or last-sync) time and never tracks main's current tip, so on this
          # `pull_request`-triggered checkout (whose HEAD is the ephemeral
          # `refs/pull/<n>/merge` commit) it would misread changesets added by
          # OTHER PRs merged into main since as "added by this PR" — a false
          # negative that can let a real fix/feat PR through without one. See #1799.
          git fetch --quiet origin +main:refs/remotes/origin/main
          base="$(git merge-base HEAD origin/main)"

          # New changeset markdown files added in this PR (README.md is pre-existing).
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- '.changeset/*.md' \
            | grep -vE '\.changeset/README\.md$' || true)

          if [[ -z "$added" ]]; then
            type="${PR_TITLE%%[(:]*}"
            echo "::error::This is a '$type' PR but no changeset was added. Run 'pnpm changeset', describe the change, and commit the generated file under .changeset/. (Add the 'skip-changeset' label to bypass.)"
            exit 1
          fi

          echo "Found changeset(s):"
          echo "$added"

      - name: Require consumer changesets for shared-core changes
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        shell: bash
        # A single Rust crate (rsvelte_core) is compiled into several separate
        # npm artifacts (compiler, svelte-check, vite-plugin-svelte-native, …).
        # Some share no npm dependency edge, so Changesets can't cascade a core
        # change between them — each must be named explicitly or it ships stale.
        run: node scripts/release/check-core-consumer-changesets.mjs

      - name: Require an rsvelte_esrap crate version bump
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        run: node scripts/release/check-esrap-version-bump.mjs
