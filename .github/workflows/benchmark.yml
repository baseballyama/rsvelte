name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'crates/rsvelte_core/**'
      - 'crates/rsvelte_devtools/**'
      - 'crates/rsvelte_formatter/**'
      - 'crates/rsvelte_fmt/**'
      - 'crates/rsvelte_lint/**'
      - 'crates/rsvelte_projection/**'
      - 'benches/corpus/**'
      - 'benches/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    # Default + `labeled` so adding the `bench` label triggers a run; the
    # job's `if:` below skips unlabeled events.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by the head branch on a PR (a new push supersedes the old run) and by
  # the commit otherwise, so a push to `main` shares a group with nothing and
  # cannot be cancelled. The previous guard — `cancel-in-progress:
  # ${{ github.ref != 'refs/heads/main' }}` — did not hold: every `main` run
  # under it was still cancelled the instant the next merge started, so `main`
  # never produced a verdict. The cost is one run per merge instead of one per
  # burst; a branch with no verdict reads exactly like a green one, which is
  # how a stale ratchet reached `main` unnoticed (#2435/#2593).
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  # CodSpeed compares a PR against `main`'s run for the merge base, so a `main`
  # branch with no run makes it fall back to an older commit and report every
  # PR as a large regression.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Criterion reports absolute wall-clock throughput, which is noisier than
    # CodSpeed's instruction counts and moves slowly — not worth gating every
    # PR on. Always run on push to `main` (and manual dispatch); on PRs run
    # only when the PR is labeled `bench`. (The per-PR *regression* signal
    # comes from the CodSpeed workflow, which runs on every PR.)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'bench'))
    steps:
      # No submodules: the bench harnesses read the in-repo corpus
      # (`benches/corpus/`) and in-code synthetic generators, never the
      # `svelte` submodule — so there's nothing to build or generate first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run criterion
        # CI tracks five representative compiler paths; the complete suite
        # remains available through the individual local benchmark targets.
        run: >-
          cargo bench
          --profile ci-bench -p rsvelte_bench --bench ci --
          --save-baseline pr --noplot
          --warm-up-time 1 --measurement-time 2 --sample-size 10
        timeout-minutes: 8

      - name: Upload criterion reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion/
          retention-days: 14

      - name: Summarize on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'target/criterion';
            if (!fs.existsSync(root)) return;
            const lines = ['## Benchmarks (criterion)\n'];
            lines.push(`Baseline saved as \`pr\`. Full HTML reports are in the \`criterion-${context.sha}\` artifact.\n`);
            // Walk shallowly and print the name of each top-level benchmark group.
            for (const name of fs.readdirSync(root)) {
              if (name === 'report') continue;
              const stat = fs.statSync(path.join(root, name));
              if (stat.isDirectory()) lines.push(`- \`${name}\``);
            }
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body && c.body.startsWith('## Benchmarks (criterion)')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
