name: Site Performance Report

# Produces the real-world compiler report rendered by /benchmark. It is manual
# because stable timing needs a named runner and should not gate ordinary PRs.

on:
  workflow_dispatch:
    inputs:
      warmups:
        description: "Warmup runs"
        required: false
        default: "1"
      runs:
        description: "Measured runs"
        required: false
        default: "5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  performance-report:
    name: Real-world compiler report
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "true"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pinned corpus sources
        run: pnpm run corpus:sync

      - name: Build official Svelte compiler
        working-directory: submodules/svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install version-pinned competitor oracle
        run: npm run report:competitors:install

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build Rust benchmark runner
        run: cargo build --release -p rsvelte_devtools --bin benchmark_runner

      - name: Collect real-world source corpus
        run: pnpm run corpus:collect

      - name: Generate performance report
        env:
          REPORT_WARMUPS: ${{ github.event.inputs.warmups || '1' }}
          REPORT_RUNS: ${{ github.event.inputs.runs || '5' }}
          BENCHMARK_RUNNER_LABEL: ubuntu-24.04-arm (GitHub-hosted, ${{ runner.arch }})
        run: npm run report:performance
        timeout-minutes: 45

      - name: Show summary
        run: |
          echo '### Real-world compiler report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '{generatedAt,corpus,runner,surfaces:[.surfaces[]|{id,classes:[.comparisonClasses[]|{id,files,variants:[.variants[]|{id,status,compiledFiles,speedup,cvPct}]}]}]}' apps/playground/static/performance-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-report
          path: apps/playground/static/performance-report.json
          retention-days: 30
