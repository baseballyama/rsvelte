name: Corpus Compat

# Compiles every .svelte / .svelte.(js|ts) source (including markdown code
# blocks) from every corpus source repository — sveltejs/svelte, sveltejs/
# svelte.dev, and the real-world projects bits-ui / flowbite-svelte / melt-ui /
# shadcn-svelte, each pinned by its submodule gitlink (see
# scripts/compat-corpus/corpus-sources.json) — with BOTH the official Svelte
# compiler and rsvelte, for the client (CSR), server (SSR) and client-dev
# (CSR with `dev: true`) targets, normalizes both output trees with oxfmt, and
# requires the results to be byte-identical.
# The same corpus also drives a svelte2tsx TSX output-parity check (official
# svelte2tsx from submodules/language-tools vs rsvelte's port) plus a structural
# gate on the source map both tools return. See scripts/compat-corpus/README.md.
#
# Expected outputs are regenerated from the pinned upstreams on every run, so
# bumping any submodule (auto-update-svelte.yml for the compiler,
# auto-update-submodules.yml for svelte.dev and the real-world projects)
# automatically refreshes both the test corpus and its expectations.
#
# The fmt-parity job additionally formats every .svelte component with both
# rsvelte-fmt and the oxfmt(`svelte: true`) oracle (prettier-plugin-svelte for
# the structure + oxc for embedded JS/CSS — rsvelte-fmt's exact layering) and
# requires byte-identical output, ratcheted by compatibility/fmt-known-failures.json.
#
# The check-parity job runs the committed mini-projects under
# compatibility/check-fixtures through both the official `svelte-check` and
# rsvelte-check and requires identical diagnostic sets. It is the only gate whose
# unit is a type-checked PROJECT rather than per-file text, so it is where alias
# resolution, workspace layout and the .d.ts environment are observable at all.
#
# The check-e2e-parity job is the same comparison over REAL project trees
# (submodules/cmsaasstarter, submodules/skeleton) installed from their own
# lockfiles — the shape every report in the #1883-#1889 cluster came from.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'scripts/compat-corpus/**'
      - 'scripts/fixtures/fmt-corpus.oxfmtrc.json'
      - 'pnpm-lock.yaml'
      - 'compatibility/**'
      - 'submodules/svelte'
      - 'submodules/svelte.dev'
      - 'submodules/language-tools'
      - 'submodules/bits-ui'
      - 'submodules/flowbite-svelte'
      - 'submodules/melt-ui'
      - 'submodules/shadcn-svelte'
      - 'submodules/sveltestrap'
      - 'submodules/attractions'
      - 'submodules/svelte-ux'
      - 'submodules/smelte'
      - 'submodules/svar-core'
      - 'submodules/svelte-table'
      - 'submodules/powertable'
      - 'submodules/svelte-pivottable'
      - 'submodules/svelte-toast'
      - 'submodules/svelte-sonner'
      - 'submodules/svelte-notifications'
      - 'submodules/svelte-fa'
      - 'submodules/svelte-heroicons'
      - 'submodules/svelte-calendar'
      - 'submodules/date-picker-svelte'
      - 'submodules/svelte-maplibre'
      - 'submodules/layercake'
      - 'submodules/layerchart'
      - 'submodules/svelte-splitpanes'
      - 'submodules/svelte-stepper'
      - 'submodules/svelte-formly'
      - 'submodules/svelte-form-builder'
      - 'submodules/svelte-checkbox'
      - 'submodules/svelte-toggle'
      - 'submodules/svelthree'
      - 'submodules/cmsaasstarter'
      - 'submodules/skeleton'
      - 'scripts/compat-corpus/corpus-sources.json'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corpus-compat.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'scripts/compat-corpus/**'
      - 'scripts/fixtures/fmt-corpus.oxfmtrc.json'
      - 'pnpm-lock.yaml'
      - 'compatibility/**'
      - 'submodules/svelte'
      - 'submodules/svelte.dev'
      - 'submodules/language-tools'
      - 'submodules/bits-ui'
      - 'submodules/flowbite-svelte'
      - 'submodules/melt-ui'
      - 'submodules/shadcn-svelte'
      - 'submodules/sveltestrap'
      - 'submodules/attractions'
      - 'submodules/svelte-ux'
      - 'submodules/smelte'
      - 'submodules/svar-core'
      - 'submodules/svelte-table'
      - 'submodules/powertable'
      - 'submodules/svelte-pivottable'
      - 'submodules/svelte-toast'
      - 'submodules/svelte-sonner'
      - 'submodules/svelte-notifications'
      - 'submodules/svelte-fa'
      - 'submodules/svelte-heroicons'
      - 'submodules/svelte-calendar'
      - 'submodules/date-picker-svelte'
      - 'submodules/svelte-maplibre'
      - 'submodules/layercake'
      - 'submodules/layerchart'
      - 'submodules/svelte-splitpanes'
      - 'submodules/svelte-stepper'
      - 'submodules/svelte-formly'
      - 'submodules/svelte-form-builder'
      - 'submodules/svelte-checkbox'
      - 'submodules/svelte-toggle'
      - 'submodules/svelthree'
      - 'submodules/cmsaasstarter'
      - 'submodules/skeleton'
      - 'scripts/compat-corpus/corpus-sources.json'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/corpus-compat.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The NAPI build is the whole job's bottleneck (~5 min of the ~6 min total):
  # the default `release` profile's `lto = "fat"` + `codegen-units = 1` runs an
  # uncacheable whole-program pass every time, while the actual corpus compile +
  # verify over 6,400+ entries takes only ~0.2 min. Turning LTO off and splitting
  # codegen cuts the build sharply; the resulting compiler binary is marginally
  # slower per file but the run is already negligible, so the net is a large win.
  # Mirrors the `compatibility-report` job; release artifacts keep fat-LTO.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  corpus:
    name: Compiler parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Checkout corpus source submodules (shallow)
        run: git submodule update --init --depth 1 submodules/svelte submodules/svelte.dev submodules/language-tools submodules/bits-ui submodules/flowbite-svelte submodules/melt-ui submodules/shadcn-svelte submodules/sveltestrap submodules/attractions submodules/svelte-ux submodules/smelte submodules/svar-core submodules/svelte-table submodules/powertable submodules/svelte-pivottable submodules/svelte-toast submodules/svelte-sonner submodules/svelte-notifications submodules/svelte-fa submodules/svelte-heroicons submodules/svelte-calendar submodules/date-picker-svelte submodules/svelte-maplibre submodules/layercake submodules/layerchart submodules/svelte-splitpanes submodules/svelte-stepper submodules/svelte-formly submodules/svelte-form-builder submodules/svelte-checkbox submodules/svelte-toggle submodules/svelthree submodules/cmsaasstarter submodules/skeleton

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install root dependencies (oxfmt)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve Svelte submodule SHA
        id: svelte-sha
        run: echo "sha=$(git submodule status submodules/svelte | awk '{print $1}' | sed 's/^[+-]//')" >> "$GITHUB_OUTPUT"

      - name: Cache Svelte compiler dependencies
        id: svelte-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            submodules/svelte/node_modules
            submodules/svelte/packages/svelte/node_modules
          key: corpus-svelte-deps-v1-${{ runner.os }}-${{ steps.svelte-sha.outputs.sha }}-${{ hashFiles('submodules/svelte/pnpm-lock.yaml') }}

      - name: Install Svelte compiler dependencies
        if: steps.svelte-deps-cache.outputs.cache-hit != 'true'
        run: |
          cd submodules/svelte
          pnpm install --frozen-lockfile

      - name: Build official svelte2tsx (parsing with the mirrored svelte)
        # Built fresh every run (not cached): pnpm's node_modules links into a
        # content-addressable store, which actions/cache cannot round-trip
        # intact — a restored cache loses runtime deps like `dedent-js`. The
        # build is cheap, so correctness beats caching here.
        run: |
          cd submodules/language-tools
          pnpm install --frozen-lockfile --ignore-scripts
          # svelte2tsx parses with whatever `svelte/compiler` it resolves; pin it
          # to the exact svelte rsvelte mirrors so the TSX oracle is generated
          # by the same parser (otherwise the v4 dev-dep rejects Svelte-5 syntax).
          SV=$(node -p "require('../svelte/packages/svelte/package.json').version")
          pnpm --filter svelte2tsx add -D "svelte@$SV"
          pnpm --filter svelte2tsx build

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # The release NAPI build compiles oxc from a git rev — ~15 min cold.
          # rust-cache skips saving on a failed job by default, so a single
          # timeout/failure left the cache cold forever and every later run
          # recompiled from scratch and could time out again. Saving on failure
          # preserves the compiled `target/` and breaks that deadlock (mirrors
          # the same fix in benchmark.yml).
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rsvelte NAPI binding
        run: |
          cargo build --release -p rsvelte_napi --lib
          mkdir -p .corpus-cache
          cp target/release/librsvelte_napi.so .corpus-cache/rsvelte.node

      - name: Collect corpus
        run: node scripts/compat-corpus/collect.mjs

      - name: Compile corpus (official svelte + rsvelte, CSR + SSR + CSR dev)
        run: node scripts/compat-corpus/compile.mjs

      - name: Verify (oxfmt-normalized outputs must be identical)
        run: node scripts/compat-corpus/verify.mjs

      - name: Convert corpus to TSX (official svelte2tsx + rsvelte)
        run: node scripts/compat-corpus/svelte2tsx-compile.mjs

      # One invocation, two ratchets: TSX text parity against official
      # svelte2tsx, and structural validity of the source map each side returns.
      - name: Verify svelte2tsx (oxfmt-normalized TSX + source maps)
        run: node scripts/compat-corpus/svelte2tsx-verify.mjs

      # Synthetic combinatorial sweep of unused-CSS pruning — catches
      # per-sibling-traversal prune bugs the happy-path corpus can't (issue
      # #1700). Reuses the binding staged above; shrink-only ratchet.
      - name: Verify CSS-prune sweep (no new divergences)
        run: node scripts/compat-corpus/css-prune-sweep.mjs --check

      # The expected/actual trees cluster.mjs reads are not uploaded (too large),
      # so the clustering has to happen here, on the runner, while they exist.
      - name: Cluster failures
        if: failure()
        run: node scripts/compat-corpus/cluster.mjs > compatibility/cluster.txt || true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-report
          path: |
            compatibility/report.json
            compatibility/report-s2t.json
            compatibility/manifest.json
            compatibility/cluster.txt
          if-no-files-found: ignore
          retention-days: 14

  fmt-parity:
    name: Formatter parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Checkout corpus source submodules (shallow)
        run: git submodule update --init --depth 1 submodules/svelte submodules/svelte.dev submodules/bits-ui submodules/flowbite-svelte submodules/melt-ui submodules/shadcn-svelte submodules/sveltestrap submodules/attractions submodules/svelte-ux submodules/smelte submodules/svar-core submodules/svelte-table submodules/powertable submodules/svelte-pivottable submodules/svelte-toast submodules/svelte-sonner submodules/svelte-notifications submodules/svelte-fa submodules/svelte-heroicons submodules/svelte-calendar submodules/date-picker-svelte submodules/svelte-maplibre submodules/layercake submodules/layerchart submodules/svelte-splitpanes submodules/svelte-stepper submodules/svelte-formly submodules/svelte-form-builder submodules/svelte-checkbox submodules/svelte-toggle submodules/svelthree submodules/cmsaasstarter submodules/skeleton

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install root dependencies (oxfmt)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rsvelte-fmt
        run: cargo build --release -p rsvelte_fmt

      - name: Collect corpus
        run: node scripts/compat-corpus/collect.mjs

      - name: Resolve corpus pins
        id: pins
        # One combined hash over every corpus source submodule SHA, so a bump to
        # any source (svelte, svelte.dev, or a real-world project) invalidates the
        # cached fmt oracle. The in-repo `pattern` source has no gitlink, so its
        # files are hashed into the cache key directly (see below).
        run: |
          echo "sources=$(git submodule status submodules/svelte submodules/svelte.dev submodules/bits-ui submodules/flowbite-svelte submodules/melt-ui submodules/shadcn-svelte submodules/sveltestrap submodules/attractions submodules/svelte-ux submodules/smelte submodules/svar-core submodules/svelte-table submodules/powertable submodules/svelte-pivottable submodules/svelte-toast submodules/svelte-sonner submodules/svelte-notifications submodules/svelte-fa submodules/svelte-heroicons submodules/svelte-calendar submodules/date-picker-svelte submodules/svelte-maplibre submodules/layercake submodules/layerchart submodules/svelte-splitpanes submodules/svelte-stepper submodules/svelte-formly submodules/svelte-form-builder submodules/svelte-checkbox submodules/svelte-toggle submodules/svelthree submodules/cmsaasstarter submodules/skeleton | awk '{print $1}' | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      # The oracle depends only on the pins + oxfmt version + oracle config, so
      # cache it: only the first run per pin pays the batched oracle build.
      - name: Cache fmt oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            compatibility/fmt/oracle
            compatibility/fmt/meta.json
          key: corpus-fmt-oracle-v1-${{ runner.os }}-${{ steps.pins.outputs.sources }}-${{ hashFiles('scripts/fixtures/fmt-corpus.oxfmtrc.json', 'pnpm-lock.yaml', 'compatibility/pattern-corpus/**') }}

      - name: Build fmt trees (oracle cached, actual via rsvelte-fmt)
        run: node scripts/compat-corpus/fmt.mjs

      - name: Verify formatter parity (ratchet, byte-identical)
        run: node scripts/compat-corpus/fmt-verify.mjs

      - name: Upload fmt report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-fmt-report
          path: |
            compatibility/fmt-report.json
            compatibility/fmt/meta.json
          if-no-files-found: ignore
          retention-days: 14

  lint-parity:
    name: Lint parity (eslint-plugin-svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Checkout lint-corpus submodules (shallow)
        # eslint-plugin-svelte + svelte-eslint-parser supply the rule/parser
        # fixtures; the real-world component libraries (bits-ui / flowbite-svelte
        # / melt-ui / shadcn-svelte — the same pins the compile corpus uses) add
        # production-source breadth.
        run: git submodule update --init --depth 1 submodules/eslint-plugin-svelte submodules/svelte-eslint-parser submodules/bits-ui submodules/flowbite-svelte submodules/melt-ui submodules/shadcn-svelte submodules/skeleton

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rsvelte-lint
        # `--profile dist-lint` (release optimization + `panic = "unwind"`) so the
        # CLI's per-file `catch_unwind` isolation actually holds when a single
        # corpus file makes the compiler panic — the shared release/dist profiles
        # use `panic = "abort"`, which would SIGABRT the whole ~12k-file run.
        run: cargo build --profile dist-lint --bin rsvelte-lint

      # The oracle is the pinned real eslint-plugin-svelte; deps install into an
      # isolated package so the comparison never drifts from what users run.
      - name: Install lint oracle (real eslint-plugin-svelte)
        run: npm --prefix scripts/compat-corpus/lint-oracle install --no-package-lock

      - name: Collect lint corpus
        run: node scripts/compat-corpus/lint-collect.mjs eslint-plugin-svelte svelte-eslint-parser bits-ui flowbite-svelte melt-ui shadcn-svelte skeleton

      - name: Verify lint parity (ratchet against lint-known-failures.json)
        run: node scripts/compat-corpus/lint-verify.mjs

  check-parity:
    name: svelte-check parity (official svelte-check vs ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oracle (official svelte-check) is always tsc-based; only the
        # rsvelte-check side under test switches backend. `tsgo` is rsvelte's
        # other shipped backend (`rsvelte-check --tsgo`) and was, before this
        # matrix, never exercised by any CI job (#1897 Layer 4). Measured
        # locally: tsc and tsgo produce identical diagnostics across every
        # scenario, so both legs ratchet against the same
        # check-known-failures.json (see check-verify.mjs's BACKEND comment).
        backend: [tsc, tsgo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # No submodules: the oracle is the published `svelte-check` package, and
      # the scenarios are committed mini-projects under compatibility/check-fixtures.

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check-parity
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rsvelte-check
        run: cargo build --release -p rsvelte_check

      # The oracle is the pinned real svelte-check; its node_modules is also what
      # every fixture is type-checked against, so both sides see identical deps.
      - name: Install check oracle (real svelte-check)
        run: npm --prefix scripts/compat-corpus/check-oracle install --no-package-lock

      # Only the tsgo leg needs this: the tsc leg type-checks against the
      # oracle's own tsc (scripts/compat-corpus/check-oracle), same as before
      # this matrix existed.
      - name: Install tsgo backend
        if: matrix.backend == 'tsgo'
        run: npm --prefix scripts/compat-corpus/check-tsgo install --no-package-lock

      - name: Verify svelte-check parity (ratchet against check-known-failures.json)
        run: node scripts/compat-corpus/check-verify.mjs --rsvelte-backend ${{ matrix.backend }}

      - name: Upload check report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-check-report-${{ matrix.backend }}
          path: |
            compatibility/check-report.json
            compatibility/check-report.tsgo.json
          if-no-files-found: ignore
          retention-days: 14

  check-e2e-parity:
    name: svelte-check e2e parity (real projects)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Only the two e2e projects: a single-package SvelteKit app (npm) and a
      # pnpm workspace monorepo whose playground resolves sibling packages.
      - name: Checkout e2e project submodules (shallow)
        run: git submodule update --init --depth 1 submodules/cmsaasstarter submodules/skeleton

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rsvelte-check
        run: cargo build --release -p rsvelte_check

      # The oracle is the pinned real svelte-check. Unlike the Layer 1 job it is
      # NOT injected into the projects (they keep their own dependency trees) —
      # it supplies the checker on both sides, including the `tsc` rsvelte-check
      # runs via TSGO_BIN, so one identical compiler type-checks both.
      - name: Install check oracle (real svelte-check)
        run: npm --prefix scripts/compat-corpus/check-oracle install --no-package-lock

      - name: Resolve e2e project pins
        id: e2e-pins
        run: echo "sources=$(git submodule status submodules/cmsaasstarter submodules/skeleton | awk '{print $1}' | sed 's/^[+-]//' | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      # Queried from inside the monorepo so it is the store of the pnpm its
      # `packageManager` field pins, not the one the root repo pins.
      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: submodules/skeleton
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # The package stores, not the projects' node_modules: pnpm links its
      # node_modules into a content-addressable store, which actions/cache
      # cannot round-trip intact. Restoring the stores keeps the installs
      # offline-ish while `--frozen-lockfile` / `npm ci` keep them exact.
      - name: Cache project dependency stores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.npm
          key: check-e2e-deps-v1-${{ runner.os }}-${{ steps.e2e-pins.outputs.sources }}

      - name: Verify svelte-check e2e parity (ratchet against check-e2e-known-failures.json)
        run: node scripts/compat-corpus/check-e2e-verify.mjs

      - name: Upload e2e check report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-check-e2e-report
          path: compatibility/check-e2e-report.json
          if-no-files-found: ignore
          retention-days: 14
