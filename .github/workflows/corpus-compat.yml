name: Corpus Compat

# Compiles every .svelte / .svelte.(js|ts) source (including markdown code
# blocks) from every corpus source repository — sveltejs/svelte, sveltejs/
# svelte.dev, and the real-world projects bits-ui / flowbite-svelte / melt-ui /
# shadcn-svelte, each pinned by its submodule gitlink (see
# scripts/compat-corpus/corpus-sources.json) — with BOTH the official Svelte
# compiler and rsvelte, for the client (CSR), server (SSR), client-dev
# (CSR with `dev: true`) and server-dev targets, normalizes both output trees with oxfmt, and
# requires the results to be byte-identical.
# The same corpus also drives a svelte2tsx TSX output-parity check (official
# svelte2tsx from submodules/language-tools vs rsvelte's port) plus a structural
# gate on the source map both tools return. See scripts/compat-corpus/README.md.
#
# Expected outputs are regenerated from the pinned upstreams on every run, so
# bumping any submodule (auto-update-svelte.yml for the compiler,
# auto-update-submodules.yml for svelte.dev and the real-world projects)
# automatically refreshes both the test corpus and its expectations.
#
# The fmt-parity job additionally formats every .svelte component with both
# rsvelte-fmt and the oxfmt(`svelte: true`) oracle (prettier-plugin-svelte for
# the structure + oxc for embedded JS/CSS — rsvelte-fmt's exact layering) and
# requires byte-identical output, ratcheted by compatibility/fmt-known-failures.json.
#
# The check-parity job runs the committed mini-projects under
# compatibility/check-fixtures through both the official `svelte-check` and
# rsvelte-check and requires identical diagnostic sets. It is the only gate whose
# unit is a type-checked PROJECT rather than per-file text, so it is where alias
# resolution, workspace layout and the .d.ts environment are observable at all.
#
# The check-e2e-parity job is the same comparison over REAL project trees
# (submodules/cmsaasstarter, submodules/skeleton) installed from their own
# lockfiles — the shape every report in the #1883-#1889 cluster came from.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'scripts/compat-corpus/**'
      - 'scripts/compat-lsp/**'
