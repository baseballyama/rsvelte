# Compares main's lint (`rsvelte_lint`) with this branch's (`rsvelte_svelte_lint`) on every Svelte
# component of the corpus; tools/performance/workloads/lint-versus-main/README.md says what each
# job measures. The report is the run's summary and the `lint-versus-main-report` artifact.
name: Lint versus main

on:
  push:
    branches: [perf/lint-main-vs-experimental]
  workflow_dispatch:
    inputs:
      main:
        description: The main revision to compare with
        default: main

permissions:
  contents: read

concurrency:
  group: lint-versus-main-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  W: tools/performance/workloads/lint-versus-main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.main || 'main' }}
          path: .main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/rust
      - run: node "$W/arms.ts" .main "$RUNNER_TEMP/arms"
      # One build at a time, so the two never compete for the runner.
      - run: |
          for arm in main experimental; do
            cargo build --release --manifest-path "$RUNNER_TEMP/arms/$arm/Cargo.toml" \
              --target-dir "$RUNNER_TEMP/target-$arm"
            mkdir -p bin
            cp "$RUNNER_TEMP/target-$arm/release/$arm-arm" bin/
          done
          git -C .main rev-parse HEAD > bin/main-revision
          git rev-parse HEAD > bin/experimental-revision
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arms-${{ matrix.os }}
          path: bin/
          if-no-files-found: error

  measure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arms-${{ matrix.os }}
          path: bin
      - run: chmod +x bin/*-arm
      - run: node "$W/stage.ts" "$RUNNER_TEMP/stage"
      - name: Measure
        env:
          LABEL: ${{ matrix.os }}
        run: |
          M=(node "$W/measure.ts")
          A=(--main bin/main-arm --experimental bin/experimental-arm --out results)
          "${M[@]}" platform "${A[@]}" --main-revision "$(cat bin/main-revision)" \
            --experimental-revision "$(cat bin/experimental-revision)" --label "$LABEL"
          "${M[@]}" universe "${A[@]}"
          "${M[@]}" check "${A[@]}" --inputs "$RUNNER_TEMP/stage/inputs.txt" --sample 20
          "${M[@]}" findings "${A[@]}"
          "${M[@]}" files "${A[@]}" --rounds 5
          "${M[@]}" wall "${A[@]}" --repetitions 4 --rounds 3 --threads 1,all \
            --allocators system,mimalloc
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}
          path: results/
          if-no-files-found: ignore

  instructions:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        part:
          [
            whole,
            rules-0-of-6,
            rules-1-of-6,
            rules-2-of-6,
            rules-3-of-6,
            rules-4-of-6,
            rules-5-of-6,
          ]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: |
          if ! sudo apt-get install -y --no-install-recommends valgrind; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends valgrind
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arms-ubuntu-24.04
          path: bin
      - run: chmod +x bin/*-arm
      - run: node "$W/stage.ts" "$RUNNER_TEMP/stage"
      - name: Measure
        env:
          PART: ${{ matrix.part }}
        run: |
          M=(node "$W/measure.ts")
          A=(--main bin/main-arm --experimental bin/experimental-arm --out results)
          # The same rules and inputs as the measure job, from the same binaries.
          "${M[@]}" universe "${A[@]}" > /dev/null
          "${M[@]}" check "${A[@]}" --inputs "$RUNNER_TEMP/stage/inputs.txt" --sample 20
          "${M[@]}" instructions "${A[@]}" --part "$PART"
          mkdir -p "parts/$PART"
          cp results/instructions-*.jsonl "parts/$PART/"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instructions-${{ matrix.part }}
          path: parts/
          if-no-files-found: ignore

  report:
    needs: [measure, instructions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - run: |
          shopt -s nullglob
          node "$W/report.ts" report.md downloaded/results-* downloaded/instructions-*/*
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-versus-main-report
          path: |
            report.md
            downloaded/results-*
            downloaded/instructions-*
