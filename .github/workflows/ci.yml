# Every gate the repository has, on every push and pull request, as jobs that run at once:
# - rust-format: rustfmt with the pinned nightly;
# - rust-lint: the lint gate (both feature sets, rustdoc);
# - rust-test: the test suites (each crate's fixture snapshots, and every corpus unit against the
#   official output with the parity ledger, corpus/_registry/parity/; the type-check ones run tsc
#   from tools/oracle/node_modules);
# - oracle: the structure check and the oracle tools' own tests (the behaviour oracle among them);
# - performance: the deterministic performance ratchet (tools/performance/baseline.json): allocations exactly,
#   and cachegrind's instruction counts (a warm round, and loading) on the platform the baseline
#   records (arm64 Linux);
# - site: the /learn course's tests (every quoted kernel item still exists and its marked lines
#   still occur; the performance history ends at the current baseline), svelte-check and the build;
# - typescript: oxfmt, oxlint, knip and the type check over the pnpm workspace (the site and tools).
# The two ratchets are two-sided: an improvement that is not recorded fails as a regression does.
name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFMT_TOOLCHAIN: nightly-2026-11-03

jobs:
  rust-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fetch
      # The same commands as `mise run lint`.
      - run: cargo clippy --offline --workspace --all-targets
      - run: cargo clippy --offline --workspace --all-targets --all-features
      - run: cargo doc --offline --workspace --no-deps --all-features

  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fetch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          # setup-node 5+ caches the package manager's store on its own; CI has never cached it.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      - run: cargo test --offline --workspace

  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      - uses: ./.github/actions/rust
      - run: node --test tools/structure/*.test.ts
      - run: node tools/structure/structure.ts
      # The semantic tests build other crates with --offline, so fetch the whole lockfile first.
      - run: cargo fetch
      # The behaviour oracle against hand-written twins and deliberately wrong translations.
      - run: pnpm test
        working-directory: tools/oracle

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/site
    steps:
      # The measure and polish chapters read every committed tools/performance/baseline.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.1 --locked
      # wasm-pack downloads wasm-bindgen and wasm-opt from GitHub releases on every run; when that
      # fails it compiles wasm-bindgen (90 s) or stops.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.1-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      # test, check and build each start by generating; it is done, so they skip that and run at
      # once. SvelteKit's sync writes a file only when its content changes, so they share it.
      - run: |
          declare -A pids
          for script in test check build; do
            pnpm --config.enable-pre-post-scripts=false run "$script" > "$RUNNER_TEMP/$script.log" 2>&1 &
            pids[$script]=$!
          done
          failed=()
          for script in test check build; do
            if ! wait "${pids[$script]}"; then failed+=("$script"); fi
            echo "::group::$script"
            cat "$RUNNER_TEMP/$script.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi

  performance:
    # The instruction baseline is recorded on arm64 Linux (`performance.ts linux` runs the same
    # environment locally); allocation counts are the same on every platform.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      # The image's package lists usually still name valgrind; updating them took 15 seconds.
      - run: |
          if ! sudo apt-get install -y --no-install-recommends valgrind; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends valgrind
          fi
      - run: node --test tools/performance/*.test.ts
      - uses: ./.github/actions/rust
      - run: cargo fetch
      - run: node tools/performance/performance.ts ratchet --instructions --json performance-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: performance-report.json
          if-no-files-found: ignore
