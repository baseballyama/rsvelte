# Every gate the repository has, on every push and pull request:
# - rust: formatting, the lint gate (both feature sets, rustdoc), the test suites;
# - fixtures: every task over every fixture unit, against the oracle snapshots (the parity ratchet,
#   fixtures/_registry/parity.json) and the adjustments' validity;
# - perf: the deterministic performance ratchet (tools/perf/baseline.json): allocations exactly,
#   and cachegrind's instruction count on the platform the baseline records (arm64 Linux).
# The two ratchets are two-sided: an improvement that is not recorded fails as a regression does.
name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFMT_TOOLCHAIN: nightly-2026-07-11

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
      - run: cargo fetch
      # The same commands as `mise run lint` (the rust-toolchain.toml toolchain is installed on
      # first use).
      - run: cargo clippy --offline --workspace --all-targets
      - run: cargo clippy --offline --workspace --all-targets --all-features
      - run: cargo doc --offline --workspace --no-deps --all-features
      - run: cargo test --offline --workspace

  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - run: pnpm install --frozen-lockfile
        working-directory: tools/fixtures
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rsv_cli
      - run: node tools/fixtures/bin/run-all.ts
      - run: node bin/fixtures.ts check
        working-directory: tools/fixtures
      - run: node bin/fixtures.ts adjust
        working-directory: tools/fixtures
      - name: typecheck the tools
        run: |
          (cd tools/fixtures && pnpm run typecheck)
          (cd tools/perf && node ../fixtures/node_modules/typescript-7/bin/tsc -p .)
          (cd tools/buildtime && node ../fixtures/node_modules/typescript-7/bin/tsc -p .)

  perf:
    # The instruction baseline is recorded on arm64 Linux (tools/perf/linux.sh runs the same
    # environment locally); allocation counts are the same on every platform.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      - run: node tools/perf/bin/perf.ts --instructions --json perf-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore
