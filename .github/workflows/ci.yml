# Every gate the repository has, on every push and pull request:
# - rust: formatting, the lint gate (both feature sets, rustdoc), the test suites (each crate's
#   fixture snapshots included; the type-check ones run tsc from tools/fixtures/node_modules);
# - fixtures: every task over every fixture unit, against the oracle snapshots (the parity ratchet,
#   fixtures/_registry/parity.json), the adjustments' validity and the behaviour oracle's own tests;
# - performance: the deterministic performance ratchet (tools/performance/baseline.json): allocations exactly,
#   and cachegrind's instruction counts (a warm round, and loading) on the platform the baseline
#   records (arm64 Linux);
# - site: the /learn course's tests (every quoted kernel item still exists and its marked lines
#   still occur; the performance history ends at the current baseline), svelte-check and the build.
# The two ratchets are two-sided: an improvement that is not recorded fails as a regression does.
name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFMT_TOOLCHAIN: nightly-2026-07-11

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all --check
      - run: cargo fetch
      # The same commands as `mise run lint` (the rust-toolchain.toml toolchain is installed on
      # first use).
      - run: cargo clippy --offline --workspace --all-targets
      - run: cargo clippy --offline --workspace --all-targets --all-features
      - run: cargo doc --offline --workspace --no-deps --all-features
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.4
      - run: pnpm install --frozen-lockfile
        working-directory: tools/fixtures
      - run: cargo test --offline --workspace
      - run: cargo run --offline -p rsvelte_command_line --example repo_layout > type-layout.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: type-layout
          path: type-layout.json
          if-no-files-found: ignore

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.4
      - run: pnpm install --frozen-lockfile
        working-directory: tools/fixtures
      # The fixture tools import tools/type-information by path, so its packages are needed too.
      - run: pnpm install --frozen-lockfile
        working-directory: tools/type-information
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: node --test tools/structure/test/*.test.ts
      - run: node tools/structure/bin/structure.ts
      # The semantic tests build other crates with --offline, so fetch the whole lockfile first.
      - run: cargo fetch
      - run: cargo build --release -p rsvelte_command_line
      - run: node tools/fixtures/bin/run-all.ts
      - run: node bin/fixtures.ts check
        working-directory: tools/fixtures
      - run: node bin/fixtures.ts adjust
        working-directory: tools/fixtures
      # The behaviour oracle against hand-written twins and deliberately wrong translations.
      - run: pnpm test
        working-directory: tools/fixtures
      - name: typecheck the tools
        run: |
          (cd tools/fixtures && pnpm run typecheck)
          (cd tools/performance && node ../fixtures/node_modules/typescript-7/bin/tsc -p .)
          (cd tools/buildtime && node ../fixtures/node_modules/typescript-7/bin/tsc -p .)
          (cd tools/structure && node ../fixtures/node_modules/typescript-7/bin/tsc -p .)

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/site
    steps:
      # The measure and polish chapters read every committed tools/performance/baseline.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run check
      - run: pnpm run build

  performance:
    # The instruction baseline is recorded on arm64 Linux (tools/performance/linux.sh runs the same
    # environment locally); allocation counts are the same on every platform.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - run: node --test tools/performance/test/*.test.ts
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fetch
      - run: node tools/performance/bin/performance.ts --instructions --json performance-report.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-report
          path: performance-report.json
          if-no-files-found: ignore
