# Every gate, as jobs that run at once. The two ratchets, the corpus parity ledger and the
# performance baseline, are two-sided: an unrecorded improvement fails as a regression does.
name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          toolchain=$(sed -n 's/^rustfmt = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$toolchain" ]; then
            echo "::error::mise.toml names no rustfmt toolchain"
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          cargo +"$toolchain" fmt --all --check

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fetch --locked
      # The same commands as `mise run lint`.
      - run: cargo clippy --offline --workspace --all-targets
      - run: cargo clippy --offline --workspace --all-targets --all-features
      - run: cargo doc --offline --workspace --no-deps --all-features
      - run: cargo check --locked --offline --manifest-path tools/performance/workloads/svelte-lint/Cargo.toml --target-dir target/svelte-lint-workload --all-features

  rust-test:
    # cargo runs test binaries one at a time, and the corpus alone takes as long as the rest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: command-line
            packages: -p rsvelte_command_line
          - part: workspace
            packages: --workspace --exclude rsvelte_command_line
    name: rust-test (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          key: ${{ matrix.part }}
      - run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      # The tests that type check run this program, and cargo builds it only for its own package's.
      - run: cargo build --offline -p rsvelte_typescript_content_mapper --bins
      - env:
          PACKAGES: ${{ matrix.packages }}
        run: cargo test --offline $PACKAGES

  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/oracle...
      - uses: ./.github/actions/rust
      - run: node --run test
        working-directory: tools/structure
      - run: node --run structure
        working-directory: tools/structure
      - run: node --run test
        working-directory: tools/release
      # The semantic tests build other crates with --offline, so fetch the whole lockfile first.
      - run: cargo fetch --locked
      - run: pnpm test
        working-directory: tools/oracle

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/site
    steps:
      # The measure and polish chapters read every committed tools/performance/baseline.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.1 --locked
      # wasm-pack downloads wasm-bindgen and wasm-opt from GitHub releases on every run; when that
      # fails it compiles wasm-bindgen (90 s) or stops.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.1-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      # Nothing deploys from CI, so the site's WebAssembly and exporters need not be optimized as a
      # release is.
      - env:
          CARGO_PROFILE_RELEASE_LTO: false
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_PROFILE_RELEASE_DEBUG: false
        run: pnpm run generate
      # test, check and build each start by generating; it is done, so they skip that and run at
      # once. SvelteKit's sync writes a file only when its content changes, so they share it.
      - run: |
          declare -A pids
          for script in test check build; do
            pnpm --config.enable-pre-post-scripts=false run "$script" > "$RUNNER_TEMP/$script.log" 2>&1 &
            pids[$script]=$!
          done
          failed=()
          for script in test check build; do
            if ! wait "${pids[$script]}"; then failed+=("$script"); fi
            echo "::group::$script"
            cat "$RUNNER_TEMP/$script.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi

  performance:
    # The instruction baseline is recorded on arm64 Linux (`performance.ts ratchet-linux` runs the same
    # environment locally); allocation counts are the same on every platform.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # valgrind installs while the setup steps run. The image's package lists usually still name
      # it; updating them took 15 seconds.
      - run: |
          (
            install() { sudo apt-get install -y --no-install-recommends valgrind; }
            if install || { sudo apt-get update && install; }; then status=0; else status=1; fi
            echo "$status" > "$RUNNER_TEMP/valgrind.status"
          ) > "$RUNNER_TEMP/valgrind.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/rust
      - run: cargo fetch --locked
      - run: |
          until [ -s "$RUNNER_TEMP/valgrind.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/valgrind.log"
          exit "$(cat "$RUNNER_TEMP/valgrind.status")"
      # The cache simulation's test runs valgrind.
      - run: node --run test
        working-directory: tools/performance
      - run: node tools/performance/performance.ts ratchet --instructions --json performance-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: performance-report.json
          if-no-files-found: ignore
