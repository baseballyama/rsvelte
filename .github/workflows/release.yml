name: Release

on:
  push:
    branches: [main]

# Required by changesets/action: write to contents (commit version PR, push tags),
# write to pull-requests (open the "Version Packages" PR), and id-token: write
# is left available so we can opt into npm provenance later if desired.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Fast path: open / refresh the "Version Packages" PR. The version cycle
  # never stages binaries (changeset version only bumps package.json/CHANGELOG
  # and mirrors the version into Cargo.toml/Cargo.lock as text), so this job
  # has NO dependency on the binary build matrix. Decoupling it means a flaky
  # crates.io download in one build leg can no longer block the version PR
  # from being created — the failure that produced run 27058363504.
  #
  # Runs on every push to main EXCEPT the "Version Packages" merge itself —
  # that commit consumes the changesets and triggers the `publish` job below.
  version-pr:
    name: Version PR
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can read the merge base when computing
          # which packages need releasing.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `publish` input on purpose — this job ONLY ever opens/refreshes the
      # version PR. When there are no changesets it is a no-op. Publishing is
      # handled by the `publish` job once the version PR is merged.
      - name: Create or refresh Release Pull Request
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # changeset version (bump versions, write CHANGELOG)
          # + sync-version.mjs (mirror the bump into Cargo.toml/Cargo.lock)
          version-script: pnpm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  close-version-cycle:
    name: Close version cycle
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # A publish commit must supersede an in-flight updater before it can reopen
    # the version PR from stale state.
    concurrency:
      group: release-version-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: echo "Version PR merged; publishing the approved release set."

  # Per-platform svelte-check binary builds. Each job uploads its rsvelte
  # `svelte-check` artifact; the `release` job below downloads them all and
  # stages them into the corresponding `apps/npm/svelte-check-<triple>/` package
  # directory before `changeset publish` runs. On the "Version Packages" PR
  # cycle the staged binaries are unused — that's expected; we trade a few
  # CI minutes for not having to detect publish vs. version-PR up front.
  build-svelte-check:
    name: Build svelte-check (${{ matrix.triple }})
    # Only the publish path needs binaries staged; gate every build leg to the
    # "Version Packages" merge commit so regular pushes skip them entirely.
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64, ext: '' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu, ext: '' }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, ext: '', apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, triple: win32-x64-msvc, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.triple == 'linux-x64-gnu' && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install LLVM profile tools
        if: matrix.triple == 'linux-x64-gnu'
        run: rustup component add llvm-tools-preview

      - name: Build svelte-check
        if: matrix.triple != 'linux-x64-gnu'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --profile dist -p rsvelte_check --bin svelte_check --target ${{ matrix.target }}

      - name: Build svelte-check with PGO
        if: matrix.triple == 'linux-x64-gnu'
        shell: bash
        run: scripts/release/build-svelte-check-pgo.sh

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          # cargo writes the binary as the bin's `name` field (`svelte_check`,
          # with an underscore — Cargo doesn't translate the filename), but we
          # ship it under the user-facing `svelte-check` name.
          cp "target/${{ matrix.target }}/dist/svelte_check${{ matrix.ext }}" \
             "stage/svelte-check${{ matrix.ext }}"

      # A published binary must not need a newer glibc than the floor the
      # runner image happens to provide; the check reads the artifact, so an
      # image bump cannot raise the requirement silently (#2675).
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        shell: bash
        run: scripts/release/check-glibc-floor.sh stage/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svelte-check-${{ matrix.triple }}
          path: stage/svelte-check${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  # Per-platform NAPI `.node` builds for @rsvelte/vite-plugin-svelte-native.
  # Mirrors `build-svelte-check` but builds the crate's cdylib with the `napi`
  # feature enabled, renames the platform dylib to `rsvelte.node`, and uploads
  # it for the release job to stage into the matching platform package.
  build-vps-native:
    name: Build vps-native (${{ matrix.triple }})
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64, dylib: librsvelte_napi.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64, dylib: librsvelte_napi.dylib }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu, dylib: librsvelte_napi.so }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, dylib: librsvelte_napi.so, apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, triple: win32-x64-msvc, dylib: rsvelte_napi.dll }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build NAPI cdylib
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.linker }}
        run: cargo build --profile dist-napi -p rsvelte_napi --lib --target ${{ matrix.target }}

      - name: Stage .node binary
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/dist-napi/${{ matrix.dylib }}" stage/rsvelte.node

      # A published binary must not need a newer glibc than the floor the
      # runner image happens to provide; the check reads the artifact, so an
      # image bump cannot raise the requirement silently (#2675).
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        shell: bash
        run: scripts/release/check-glibc-floor.sh stage/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vps-native-${{ matrix.triple }}
          path: stage/rsvelte.node
          if-no-files-found: error
          retention-days: 7

  # Per-platform rsvelte-fmt CLI builds for @rsvelte/fmt. Mirrors
  # `build-svelte-check`; the bin is already named `rsvelte-fmt` (Cargo
  # `[[bin]] name = "rsvelte-fmt"`), so no underscore rename is needed.
  build-rsvelte-fmt:
    name: Build rsvelte-fmt (${{ matrix.triple }})
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64, ext: '' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu, ext: '' }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, ext: '', apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, triple: win32-x64-msvc, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build rsvelte-fmt
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --profile dist --bin rsvelte-fmt --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/dist/rsvelte-fmt${{ matrix.ext }}" \
             "stage/rsvelte-fmt${{ matrix.ext }}"

      # A published binary must not need a newer glibc than the floor the
      # runner image happens to provide; the check reads the artifact, so an
      # image bump cannot raise the requirement silently (#2675).
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        shell: bash
        run: scripts/release/check-glibc-floor.sh stage/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsvelte-fmt-${{ matrix.triple }}
          path: stage/rsvelte-fmt${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  # Per-platform rsvelte-lint CLI builds for @rsvelte/lint. Mirrors
  # `build-rsvelte-fmt`; the bin is already named `rsvelte-lint` (Cargo
  # `[[bin]] name = "rsvelte-lint"`), so no underscore rename is needed. Unlike
  # the other CLIs this uses `--profile dist-lint` (NOT `dist`): the linter
  # isolates a per-file compiler panic via `catch_unwind`, which only works when
  # the binary UNWINDS. `dist` sets `panic = "abort"`, turning that isolation
  # into a whole-run SIGABRT; `dist-lint` keeps dist's opt/strip but restores
  # unwinding. The output lives under `target/<target>/dist-lint/`.
  build-rsvelte-lint:
    name: Build rsvelte-lint (${{ matrix.triple }})
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64, ext: '', dylib: librsvelte_lint.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64, ext: '', dylib: librsvelte_lint.dylib }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu, ext: '', dylib: librsvelte_lint.so }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, ext: '', apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc, dylib: librsvelte_lint.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, triple: win32-x64-msvc, ext: '.exe', dylib: rsvelte_lint.dll }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build rsvelte-lint
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --profile dist-lint --bin rsvelte-lint --target ${{ matrix.target }}

      # The NAPI `.node` addon (the engine embedded by @rsvelte/oxlint-plugin's
      # native path) ships in the same @rsvelte/lint-<triple> package. Built with
      # `--profile dist-lint` (unwind) so napi-rs converts a per-file panic into a
      # JS error rather than aborting the host process. The addon is the
      # `rsvelte_lint_bindings` cdylib (`[lib] name = "rsvelte_lint"`, so the
      # dylib stays `librsvelte_lint.*`). CC needed for the aarch64-linux build.
      - name: Build rsvelte-lint NAPI addon
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.linker }}
        run: cargo build --profile dist-lint --features napi --lib -p rsvelte_lint_bindings --target ${{ matrix.target }}

      - name: Stage binary + addon
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/dist-lint/rsvelte-lint${{ matrix.ext }}" \
             "stage/rsvelte-lint${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/dist-lint/${{ matrix.dylib }}" \
             "stage/rsvelte_lint.node"

      # A published binary must not need a newer glibc than the floor the
      # runner image happens to provide; the check reads the artifact, so an
      # image bump cannot raise the requirement silently (#2675).
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        shell: bash
        run: scripts/release/check-glibc-floor.sh stage/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsvelte-lint-${{ matrix.triple }}
          path: stage/
          if-no-files-found: error
          retention-days: 7

  # Per-platform rsvelte-language-server builds for @rsvelte/language-server.
  # Mirrors `build-rsvelte-lint`, including its profile choice: the server
  # isolates a per-document compiler panic via `catch_unwind`, which only works
  # when the binary UNWINDS, so it builds with `--profile dist-lsp` (dist's
  # opt/strip, panic = "unwind"). Output lives under `target/<target>/dist-lsp/`.
  build-rsvelte-language-server:
    name: Build rsvelte-language-server (${{ matrix.triple }})
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64, ext: '' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu, ext: '' }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, ext: '', apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, triple: win32-x64-msvc, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build rsvelte-language-server
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --profile dist-lsp --bin rsvelte-language-server --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/dist-lsp/rsvelte-language-server${{ matrix.ext }}" \
             "stage/rsvelte-language-server${{ matrix.ext }}"

      # A published binary must not need a newer glibc than the floor the
      # runner image happens to provide; the check reads the artifact, so an
      # image bump cannot raise the requirement silently (#2675).
      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        shell: bash
        run: scripts/release/check-glibc-floor.sh stage/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsvelte-language-server-${{ matrix.triple }}
          path: stage/rsvelte-language-server${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    # Publish only runs on the "Version Packages" merge commit, once the
    # version PR (opened by `version-pr` above) has been merged and the
    # changesets consumed. This is the only path that needs staged binaries.
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: close-version-cycle`: that job shares the
    # cancel-in-progress group with `version-pr` so it can supersede an
    # in-flight updater, which also means any later push to main cancels it —
    # and a cancelled dependency would skip this job, silently dropping the
    # release (run 31063492582).
    needs:
      [
        build-svelte-check,
        build-vps-native,
        build-rsvelte-fmt,
        build-rsvelte-lint,
        build-rsvelte-language-server,
      ]
    timeout-minutes: 30
    # Publishing is non-atomic across packages and must never be interrupted.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can read the merge base when computing
          # which packages need releasing.
          fetch-depth: 0

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --depth 1 submodules/svelte

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          wasm-pack: 'true'

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing requires npm >= 11.5.1. Node 22 ships an
      # older bundled npm, so pin to a known-good version that supports
      # `npm publish` against a Trusted Publisher with no NPM_TOKEN.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # `pattern` matches both svelte-check-* and vps-native-* uploads —
          # each artifact is unpacked into `artifacts/<name>/`.
          pattern: '*'
          path: artifacts

      - name: Stage svelte-check binaries
        run: pnpm run stage-svelte-check

      - name: Stage rsvelte-fmt binaries
        run: pnpm run stage-fmt

      - name: Stage rsvelte-lint binaries
        run: pnpm run stage-lint

      - name: Stage rsvelte-language-server binaries
        run: pnpm run stage-language-server

      - name: Stage vps-native binaries
        run: pnpm run stage-vps-native

      # Authentication: every publish in this job (changesets/action's
      # `changeset publish`, and the bare `npm publish` in
      # publish-platform-binaries.mjs) goes through npm OIDC trusted
      # publishing. Each @rsvelte package needs a Trusted Publisher config
      # on npmjs.com pointing at this repo + workflow. No NPM_TOKEN is set
      # on purpose — writing an empty token to ~/.npmrc silently disables
      # the OIDC fallback.
      - name: Publish
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # On the "Version Packages" merge there are no changesets left, so
          # changesets/action takes the publish path and runs this script:
          # sync-version.mjs (version → Cargo.toml / Cargo.lock),
          # wasm-pack build (regenerates pkg/ with the new version),
          # finalize-pkg.mjs (rewrites pkg/package.json to @rsvelte/compiler),
          # changeset publish (pnpm publish all workspace packages).
          # No `version` input here — version bumping happens in the separate
          # `version-pr` job, decoupled from the binary builds this job needs.
          publish-script: pnpm run release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-language-server-archives:
    name: Release language-server archives
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download language-server artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'rsvelte-language-server-*'
          path: artifacts

      - name: Package standalone archives
        run: node scripts/release/package-language-server-archives.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/npm/language-server/package.json').version")"
          tag="@rsvelte/language-server@${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* \
              --verify-tag \
              --latest=false \
              --title "rsvelte language server ${version}" \
              --notes "Standalone rsvelte-language-server binaries. Verify the selected archive with SHA256SUMS before installing."
          fi

  # Tell every pull request that shipped in this release — and the issues it
  # closed — which `package@version` carries it. Runs after `publish` so a
  # comment is never posted for a release that did not reach the registry.
  comment-released-versions:
    name: Comment released versions
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions REPLACE the workflow-level block, and the default
    # there has no `issues: write` — without it the issue comments 404.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script resolves each changeset's short hash back to its commit
          # and diffs package versions against `HEAD^`; both need real history.
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No `pnpm install`: the script has no dependencies, so it runs against a
      # bare checkout even if the release left node_modules in an odd state.
      - name: Comment released versions on pull requests and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/comment-released-versions.mjs
