# Publishes rsvelte to npm when a tag `v<version>` is pushed, where <version> is the version in
# Cargo.toml: each platform builds `rsvelte` and its content mapper, then one job writes the
# packages (tools/release) and publishes them, the platform packages first.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (otherwise build and stage only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
          # The oldest Ubuntu runner, so the binaries need the oldest glibc.
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --profile dist --locked --target "$TARGET" \
            -p rsvelte_command_line -p rsvelte_svelte_typescript_projection \
            --bin rsvelte --bin rsvelte-svelte-content-mapper
          extension=""
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          mkdir -p "artifacts/$TARGET"
          for program in rsvelte rsvelte-svelte-content-mapper; do
            cp "target/$TARGET/dist/$program$extension" "artifacts/$TARGET/"
          done
          "artifacts/$TARGET/rsvelte$extension" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsvelte-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rsvelte-*
          path: artifacts/
          merge-multiple: true
      - name: Stage the packages
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node tools/release/release.ts stage --artifacts artifacts --out staged \
            ${TAG:+--tag "$TAG"} > order.txt
          cat order.txt
      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish
        run: |
          # A package whose version is already published was published by an earlier attempt.
          while IFS= read -r directory; do
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "./$directory" --access public --provenance
          done < order.txt
