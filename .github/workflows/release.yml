# On every push to main, Changesets opens or updates the pull request "Release @rsvelte/cli",
# which takes the version from the pending changesets into apps/cli/package.json, Cargo.toml and
# the changelog. Merging it leaves no changeset, so the version has no tag yet and is released:
# each platform builds `rsvelte` and its content mapper, one job writes the npm packages
# (tools/release) and publishes them, the platform packages first, and then the GitHub release
# `v<version>` with the programs, which also makes the tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and GitHub (otherwise build and stage only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile --filter @rsvelte-experimental/workspace
      - id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run release:version
          commit-message: Release @rsvelte/cli
          pr-title: Release @rsvelte/cli
      - id: plan
        env:
          PENDING: ${{ steps.changesets.outputs.has-changesets }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version is released once its tag exists; pending changesets belong to the next one.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$PENDING" != true ] &&
            ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
          # The oldest Ubuntu runner, so the binaries need the oldest glibc.
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Releases are rare; their caches would only evict the ones CI restores on every push.
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
          save: false
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --profile dist --locked --target "$TARGET" \
            -p rsvelte_command_line -p rsvelte_svelte_typescript_projection \
            --bin rsvelte --bin rsvelte-svelte-content-mapper
          extension=""
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          mkdir -p "artifacts/$TARGET"
          for program in rsvelte rsvelte-svelte-content-mapper; do
            cp "target/$TARGET/dist/$program$extension" "artifacts/$TARGET/"
          done
          "artifacts/$TARGET/rsvelte$extension" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsvelte-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The GitHub release and its tag.
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    env:
      PUBLISH: ${{ needs.plan.outputs.release == 'true' || inputs.publish }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rsvelte-*
          path: artifacts/
          merge-multiple: true
      - name: Stage the packages
        run: |
          node tools/release/release.ts stage --artifacts artifacts --out staged > order.txt
          cat order.txt
      - name: Pack the programs
        run: |
          # An artifact loses the executable bit.
          mkdir archives
          for directory in artifacts/*/; do
            target=$(basename "$directory")
            chmod +x "$directory"*
            case "$target" in
              *windows*) (cd "$directory" && zip -q "$GITHUB_WORKSPACE/archives/rsvelte-$target.zip" ./*) ;;
              *) tar -czf "archives/rsvelte-$target.tar.gz" -C "$directory" . ;;
            esac
          done
          ls -l archives
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: |
          # A package whose version is already published was published by an earlier attempt.
          while IFS= read -r directory; do
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "./$directory" --access public --provenance
          done < order.txt
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          node tools/release/release.ts notes > notes.md
          gh release create "v$VERSION" archives/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md
