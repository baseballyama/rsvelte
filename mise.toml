[tools]
node = "26.7.0"

# The Rust toolchain itself is pinned by rust-toolchain.toml; rustfmt runs on a pinned nightly
# because the strict options in rustfmt.toml are unstable (stable rustfmt ignores them silently).
[tasks.fmt]
description = "Format the Rust workspace"
run = "cargo +nightly-2026-07-11 fmt --all"

[tasks."fmt:check"]
description = "Fail when the Rust workspace is not formatted"
run = "cargo +nightly-2026-07-11 fmt --all --check"

[tasks.structure]
description = "Check source file lengths and the checker controls"
run = ["node --test tools/structure/test/*.test.ts", "node tools/structure/bin/structure.ts"]

[tasks.lint]
depends = ["structure"]
description = "The lint gate: every lint in [workspace.lints] denies"
# Both feature sets: `metrics` swaps whole module bodies, so one set never checks the other's.
run = [
  "cargo clippy --offline --workspace --all-targets",
  "cargo clippy --offline --workspace --all-targets --all-features",
  # The rustdoc lints only run under `cargo doc`.
  "cargo doc --offline --workspace --no-deps --all-features",
]

[tasks.buildtime]
description = "Measure how long the workspace takes to compile (tools/buildtime)"
run = "node tools/buildtime/bin/buildtime.ts"

[tasks.performance]
description = "The performance ratchet: allocation (and on Linux, instruction) counts against tools/performance/baseline.json"
run = "node tools/performance/bin/performance.ts"

[tasks."performance:update"]
description = "Record the measured performance counters in tools/performance/baseline.json"
run = "node tools/performance/bin/performance.ts --update"

[tasks."performance:cache"]
description = "Profile cache locality and check a recorded baseline: <config.json> <report.json>"
run = "node tools/performance/bin/cache-profile.ts"

[tasks."performance:layout"]
description = "Report kernel, JS/TS, Svelte, Vue and CSS type sizes, alignment and field offsets"
run = "cargo run --offline -p rsvelte_command_line --example repo_layout"

[tasks."performance:hardware"]
description = "Measure Linux hardware CPU and cache counters: <config.json> <report.json>"
run = "node tools/performance/bin/linux-counters.ts"

[tasks."performance:test"]
description = "Test the measurement tools and their defect controls"
run = "node --test tools/performance/test/*.test.ts"
