# rsvelte_lint_types — the type-aware lint backend (corsa/tsgo).
#
# This crate is DELIBERATELY ITS OWN WORKSPACE (note the `[workspace]` table
# below) and is NOT a member of the root rsvelte workspace. Reason: it depends
# on `corsa` via a path into `submodules/corsa-bind`. A path dependency — even
# an optional one — is resolved by Cargo at metadata time, so listing it in the
# root workspace would force every `cargo build` / `cargo test` in the repo to
# check out that submodule and compile the whole corsa client stack, which
# nothing else needs. Isolating it keeps the default build and CI 100%
# corsa-free.
#
# `ubugeeei-prod/corsa-bind` is PUBLIC and clones with no credentials. An
# earlier revision of this header said it was private, and #1790 fell out of
# that: the suite was treated as unrunnable-in-CI and its nine tests silently
# skipped for months. `.github/workflows/type-aware-lint.yml` runs them.
#
# Because it is a separate workspace root, it must re-declare the workspace keys
# the path-dep crates (rsvelte_core / rsvelte_lint) reference via
# `[lints] workspace = true`, plus the oxc `[patch.crates-io]` those crates rely
# on for type unification. Keep the patch rev in sync with the root Cargo.toml
# when oxc is bumped (see the "Renovate oxc unified bump" note).

[package]
name = "rsvelte_lint_types"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
rsvelte_lint = { path = "../rsvelte_lint", default-features = false, features = ["native"] }
rsvelte_core = { path = "../rsvelte_core", default-features = false }
rsvelte_diagnostics = { path = "../rsvelte_diagnostics" }
rsvelte_projection = { path = "../rsvelte_projection" }
corsa_client = { path = "../../submodules/corsa-bind/src/core/corsa_client" }
corsa_runtime = { path = "../../submodules/corsa-bind/src/core/corsa_runtime" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[lints]
workspace = true

# --- isolated workspace root (see header) -----------------------------------

[workspace]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
format_push_string = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

# Mirror the root workspace's oxc unification patch so the path-dep rsvelte
# crates build with the same oxc rev. MUST match crates/../Cargo.toml.
[patch.crates-io]
oxc_allocator          = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_parser             = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast                = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast_macros         = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast_visit          = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_span               = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_diagnostics        = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_codegen            = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_syntax             = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_semantic           = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_regular_expression = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ecmascript         = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_str                = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_data_structures    = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
