[package]
name = "rsvelte"
version = "0.10.9"
edition = "2024"
rust-version = "1.95"
description = "Stable Rust facade for embedding the rsvelte Svelte compiler"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
homepage = "https://baseballyama.github.io/rsvelte/"
documentation = "https://docs.rs/rsvelte"
readme = "README.md"
keywords = ["svelte", "compiler", "toolchain", "frontend"]
categories = ["compilers", "development-tools"]
publish = ["crates-io"]
autobins = false
autobenches = false
exclude = ["tests/**"]

[lib]
crate-type = ["rlib"]

[features]
default = []
projection = ["dep:rsvelte_projection"]

[dependencies]
rsvelte_core = { version = "=0.10.9", path = "../rsvelte_core", default-features = false }
rsvelte_projection = { version = "=0.10.9", path = "../rsvelte_projection", optional = true }

[dev-dependencies]
static_assertions = "1.1"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
