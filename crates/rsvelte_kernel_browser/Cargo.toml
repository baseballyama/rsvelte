[package]
name = "rsvelte_kernel_browser"
description = "Browser bindings for the rsvelte experimental kernel"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsvelte_kernel = { workspace = true, features = ["trace-artifacts"] }
rsvelte_svelte.workspace = true
rsvelte_vue.workspace = true
rsvelte_svue.workspace = true
rsvelte_vuelte.workspace = true
wasm-bindgen = "=0.2.126"

[lints]
workspace = true
