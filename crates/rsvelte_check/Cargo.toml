[package]
name = "rsvelte_check"
version = "0.5.13"
edition = "2024"
rust-version = "1.95"
description = "Native svelte-check-compatible CLI built on rsvelte"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
homepage = "https://baseballyama.github.io/rsvelte/"
publish = false
autobins = false
autobenches = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "svelte_check"
path = "src/main.rs"

[dependencies]
rsvelte_core = { path = "../rsvelte_core", default-features = false, features = ["parallel"] }
rsvelte_diagnostics = { path = "../rsvelte_diagnostics" }
rsvelte_projection = { path = "../rsvelte_projection" }
clap = { version = "4.5", features = ["derive"] }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
oxc_allocator = "0.143"
oxc_ast = "0.143"
oxc_parser = "0.143"
oxc_resolver = "11"
oxc_span = "0.143"
rayon = "1.10"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sourcemap = "9.0"
walkdir = "2.5"

[lints]
workspace = true
