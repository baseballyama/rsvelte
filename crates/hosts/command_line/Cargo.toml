[package]
name = "rsvelte_command_line"
description = "The `rsvelte` binary: runs registered tasks over files or fixture units"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rsvelte"
path = "src/main.rs"

[features]
metrics = ["rsvelte_kernel/metrics"]

[dependencies]
rsvelte_configuration_loading.workspace = true
rsvelte_plugin_interface.workspace = true
serde_json.workspace = true
rsvelte_vue_lint.workspace = true
rsvelte_vue_format.workspace = true
rsvelte_vue_compile.workspace = true
rsvelte_vue_check.workspace = true
rsvelte_svelte_lint.workspace = true
rsvelte_svelte_format.workspace = true
rsvelte_svelte_compile.workspace = true
rsvelte_svelte_typescript_projection.workspace = true
rsvelte_svelte_check.workspace = true
rsvelte_typescript_lint.workspace = true
rsvelte_typescript_format.workspace = true
rsvelte_typescript_compile.workspace = true
rsvelte_typescript_check.workspace = true
rsvelte_kernel.workspace = true
rsvelte_corpus.workspace = true
rsvelte_vue_compile_svelte.workspace = true
rsvelte_svelte_compile_vapor.workspace = true
rayon.workspace = true
libc.workspace = true

[dev-dependencies]
rsvelte_svelte_syntax.workspace = true
rsvelte_svelte_semantic.workspace = true
rsvelte_typescript_tree.workspace = true
rsvelte_typescript_semantic.workspace = true
rsvelte_vue_semantic.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
rsvelte_test_harness.workspace = true

[[test]]
name = "fixtures"
harness = false

[[test]]
name = "corpus"
harness = false

[lints]
workspace = true
