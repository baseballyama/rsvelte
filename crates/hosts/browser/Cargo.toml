[package]
name = "rsvelte_kernel_browser"
description = "Browser bindings for the rsvelte experimental kernel"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
rsvelte_vue_lint.workspace = true
rsvelte_vue_format.workspace = true
rsvelte_vue_compile.workspace = true
rsvelte_vue_check.workspace = true
rsvelte_svelte_lint.workspace = true
rsvelte_svelte_format.workspace = true
rsvelte_svelte_compile.workspace = true
rsvelte_svelte_check.workspace = true
rsvelte_kernel = { workspace = true, features = ["trace-artifacts"] }
rsvelte_document_printer.workspace = true
rsvelte_svelte_syntax.workspace = true
rsvelte_svelte_semantic.workspace = true
rsvelte_vue_syntax.workspace = true
rsvelte_vue_semantic.workspace = true
rsvelte_vue_compile_svelte.workspace = true
rsvelte_svelte_compile_vapor.workspace = true
wasm-bindgen = "=0.2.126"

[lints]
workspace = true
