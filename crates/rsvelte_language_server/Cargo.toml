[package]
name = "rsvelte_language_server"
version = "0.5.5"
edition = "2024"
rust-version = "1.95"
description = "Language server exposing rsvelte's formatter and linter over LSP"
license = "MIT"
publish = false

[[bin]]
name = "rsvelte-language-server"
path = "src/main.rs"

[dependencies]
rsvelte_core = { path = "../rsvelte_core", default-features = false }
rsvelte_check = { path = "../rsvelte_check" }
rsvelte_diagnostics = { path = "../rsvelte_diagnostics" }
rsvelte_fmt = { path = "../rsvelte_fmt" }
rsvelte_formatter = { path = "../rsvelte_formatter" }
rsvelte_lint = { path = "../rsvelte_lint", default-features = false, features = ["native"] }
rsvelte_projection = { path = "../rsvelte_projection" }
anyhow = "1.0"
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sourcemap = "9.0"
regex = "1.11"
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "0389c4010ef8298728f3e47fff8e2a9106d10045" }

[dev-dependencies]
# Rust's `regex` rejects JS-style escapes inside a character class, which the
# official server's word pattern uses; only the test needs to evaluate it.
fancy-regex = { version = "0.19", default-features = false, features = ["std", "perf", "unicode"] }
url = "2"

[lints]
workspace = true
