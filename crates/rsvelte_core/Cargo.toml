[package]
name = "rsvelte_core"
version = "0.10.6"
edition = "2024"
rust-version = "1.95"
description = "Low-level compiler implementation for the rsvelte Svelte toolchain"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
homepage = "https://baseballyama.github.io/rsvelte/"
documentation = "https://docs.rs/rsvelte_core"
readme = "README.md"
keywords = ["svelte", "compiler", "frontend"]
categories = ["compilers", "parser-implementations"]
publish = ["crates-io"]
autobins = false
autobenches = false
exclude = ["benches/**", "src/bin/**", "tests/**"]

[lib]
# rlib only. Emitting a cdylib here too would write unhashed
# `deps/librsvelte_core.{so,rlib}`, letting cargo's two profile variants clobber
# each other and letting this crate's bins link the cdylib instead of the rlib
# (rust-lang/cargo#6313). The NAPI cdylib lives in `rsvelte_napi`.
crate-type = ["rlib"]

[features]
default = []
parallel = ["dep:rayon"]
trace-fastpath = []
# Repository-local instrumentation: replay the pre-refactor `await` scanner so
# the `String` allocations it performed can be counted. Off by default.
measure-await = []
# Repository-local instrumentation: count the slot-name `String` allocations the
# pre-refactor component slot grouping performed. Off by default.
measure-slot-key = []
# Repository-local instrumentation: count the quoted-module-source `String`
# allocations the pre-refactor `module_source` performed. Off by default.
measure-module-source = []
# Repository-local instrumentation: record the `hoisted` length distribution in
# `clean_node_list` so its pre-allocation can be judged. Off by default.
measure-hoisted = []
# Repository-local instrumentation: count the `serde_json::Value` that the lazy
# expression cache materializes. Off by default and zero-cost when off.
measure-json = []
# Repository-local instrumentation: decompose the per-prop re-scan in
# `transform_prop_reads_in_expr`. Off by default.
measure-prop-reads = []
# Select the JavaScript entropy backend when the compiler is embedded in wasm.
# Binding exports live in `rsvelte_lint_bindings`, not in this library.
wasm-target = ["dep:getrandom", "getrandom/wasm_js"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Parallelism (native only)
rayon = { version = "1.10", optional = true }

# Memory efficiency
bumpalo = { version = "3.16", features = ["collections"] }
compact_str = { version = "0.10", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
self_cell = "1.2"

# Fast hashing (5-10x faster than std HashMap/HashSet)
rustc-hash = "2.0"

# JavaScript parsing and code generation
oxc_allocator = "0.143"
oxc_parser = "0.143"
oxc_ast = { version = "0.143", features = ["serialize"] }
oxc_span = "0.143"
oxc_diagnostics = "0.143"
oxc_codegen = "0.143"
rsvelte_esrap = { version = "=0.10.2", path = "../rsvelte_esrap" }
oxc_syntax = "0.143"
oxc_semantic = "0.143"

# Error handling
thiserror = "2.0"
miette = "7.4"

# Regex. Trim to the minimal feature set our patterns need — `unicode-perl`
# (`\w \s \d \b`) + `unicode-case` (`(?i)`). We use no `\p{...}`/script/category
# classes or `\X` graphemes, so dropping `unicode-age`/`-bool`/`-gencat`/
# `-script`/`-segment` (the large Unicode tables) shrinks every artifact with no
# behavior change. (string_wizard already requests exactly this minimal set, so
# feature unification keeps the trim effective.)
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Immutable data structures for efficient cloning
im = "15.1"

# SIMD-accelerated string search
memchr = "2.7"

# Fast integer formatting (already a transitive dep, now used directly in codegen)
itoa = "1"

# Source map handling
sourcemap = "9.0"

# MagicString (Rolldown's port)
string_wizard = "1.0.0"

getrandom = { version = "0.4", optional = true }
lazy_static = "1.5.0"
indexmap = { version = "2.13.0", features = ["serde"] }
oxc_ast_visit = "0.143"

[dev-dependencies]
# Testing
rsvelte_ast_equiv = { path = "../rsvelte_ast_equiv" }
insta = { version = "1.42", features = ["json", "glob"] }
pretty_assertions = "1.4"
chrono = "0.4"
test-generator = "0.3"
glob = "0.3"
rayon = "1.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Unified diff output for test failure messages
similar = { version = "3.0", features = ["text"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
