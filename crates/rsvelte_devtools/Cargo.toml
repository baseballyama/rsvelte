[package]
name = "rsvelte_devtools"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Repository-local benchmarks, profilers, and diagnostic utilities for rsvelte"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
publish = false

[features]
default = ["native"]
native = [
    "dep:rayon",
    "jemalloc",
    "mimalloc-alloc",
    "rsvelte_core/parallel",
]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc-alloc = ["dep:mimalloc"]
pprof = ["dep:pprof"]
measure-await = ["rsvelte_core/measure-await"]
measure-slot-key = ["rsvelte_core/measure-slot-key"]
measure-module-source = ["rsvelte_core/measure-module-source"]
measure-hoisted = ["rsvelte_core/measure-hoisted"]
measure-json = ["rsvelte_core/measure-json"]
measure-prop-reads = ["rsvelte_core/measure-prop-reads"]

[dependencies]
rsvelte_ast_equiv = { path = "../rsvelte_ast_equiv" }
rsvelte_core = { path = "../rsvelte_core", default-features = false }
rsvelte_esrap = { path = "../rsvelte_esrap" }
rsvelte_projection = { path = "../rsvelte_projection" }

backtrace = "0.3"
chrono = "0.4"
oxc_allocator = "0.142"
oxc_codegen = "0.142"
oxc_parser = "0.142"
oxc_span = "0.142"
rayon = { version = "1.10", optional = true }
regex = "1.11"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
walkdir = "2.5"

[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
mimalloc = { version = "0.1", optional = true, features = ["local_dynamic_tls"] }
pprof = { version = "0.15", default-features = false, optional = true }
tikv-jemallocator = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { version = "5.0.0", features = [
    "html_reports",
], package = "codspeed-criterion-compat" }
# Repository-only compatibility probe for the unreleased OXC formatter.
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "65fe65d8429e1d1bdf86c517ff08bd119ee87660" }
similar = { version = "3.0", features = ["text"] }
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "rsvelte_core"
path = "src/main.rs"
doc = false

[[bench]]
name = "parser"
harness = false
required-features = ["native"]

[[bench]]
name = "compiler"
harness = false

[lints]
workspace = true
