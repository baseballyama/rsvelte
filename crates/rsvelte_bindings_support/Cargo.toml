[package]
name = "rsvelte_bindings_support"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Internal wire formats and Vite helpers for rsvelte bindings"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
publish = false
autobins = false
autobenches = false

[dependencies]
rsvelte_core = { path = "../rsvelte_core", default-features = false }
bumpalo = { version = "3.16", features = ["collections"] }
compact_str = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
oxc_allocator = "0.143"

[lints]
workspace = true
