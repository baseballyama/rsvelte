[package]
name = "rsvelte_lint"
version = "0.9.7"
edition = "2024"
rust-version = "1.95"
description = "Fast native Svelte linter built on the rsvelte compiler (validator wrap + native rule engine)"
license = "MIT"
publish = false

[lib]
# rlib only. The wasm playground module and the Node `.node` addon are the two
# cdylib consumers; both now live in the `rsvelte_lint_bindings` crate. Emitting
# a cdylib here too would write unhashed `deps/librsvelte_lint.{so,rlib}`,
# letting cargo's two profile variants (`panic = "abort"` for the bin, forced
# unwind for test/bench) clobber each other — cargo issue rust-lang/cargo#6313.
crate-type = ["rlib"]

[[bin]]
name = "rsvelte-lint"
path = "src/main.rs"
required-features = ["cli"]

# Benchmark driver invoked by `scripts/bench/run-benchmark.mjs` for the `lint`
# task (the ESLint + eslint-plugin-svelte comparison).
[[bin]]
name = "lint_benchmark_runner"
path = "src/bin/lint_benchmark_runner.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI: native compiler backend + ESLint-config import + the bin's runtime
# deps (clap/walkdir/rayon).
cli = ["native", "eslint-import", "dep:clap", "dep:walkdir", "dep:rayon"]
# Native product surface (CLI diagnostics, validation, and source-scan rules).
# Compiler parallelism is an independent opt-in owned by binary callers.
native = []
# `--config-from-eslint` importer (OXC). Off in the wasm build.
eslint-import = [
    "dep:oxc_ast_visit",
]

[dependencies]
rsvelte_core = { path = "../rsvelte_core", default-features = false }
rsvelte_diagnostics = { path = "../rsvelte_diagnostics" }
anyhow = "1.0"
compact_str = { version = "0.10", features = ["serde"] }
# Minimal regex feature set (see rsvelte_core's regex dep) — only `(?i)`/`\w \s`
# are used here, so the large Unicode tables are dropped.
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI-only runtime deps (off in the wasm build).
clap = { version = "4.5", features = ["derive"], optional = true }
walkdir = { version = "2.5", optional = true }
rayon = { version = "1.10", optional = true }

# OXC — same git rev as rsvelte_core (unified by the workspace `[patch]`),
# used only to statically parse `eslint.config.js` for the config importer.
oxc_allocator = "0.142"
oxc_parser = "0.142"
oxc_ast = "0.142"
oxc_ast_visit = { version = "0.142", optional = true }
oxc_span = "0.142"
oxc_semantic = "0.142"

[dev-dependencies]
serde_json = "1.0"
# Parse eslint-plugin-svelte `*-errors.yaml` fixtures in the compat oracle.
serde_yaml = "0.9"

[lints]
workspace = true
