[package]
name = "rsv_cli"
description = "The `rsv` binary: runs registered tasks over files or fixture units"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rsv"
path = "src/main.rs"

[features]
metrics = ["rsv_kernel/metrics"]

[dependencies]
rsv_kernel.workspace = true
rsv_svelte.workspace = true
rsv_vue.workspace = true
rsv_svue.workspace = true
rayon.workspace = true
libc.workspace = true

[lints]
workspace = true
