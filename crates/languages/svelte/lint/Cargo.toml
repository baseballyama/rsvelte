[package]
name = "rsvelte_svelte_lint"
description = "Svelte lint"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
rsvelte_plugin_interface.workspace = true
rsvelte_lint_runner.workspace = true
serde.workspace = true
serde_json.workspace = true
rsvelte_typescript_syntax.workspace = true
rsvelte_svelte_syntax.workspace = true
rsvelte_svelte_semantic.workspace = true
rsvelte_html_syntax.workspace = true
rsvelte_html_lint.workspace = true
rsvelte_kernel.workspace = true
rsvelte_typescript_lint.workspace = true

[dev-dependencies]
rsvelte_test_harness.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
rsvelte_kernel = { workspace = true, features = ["trace-artifacts"] }

[[test]]
name = "fixtures"
harness = false

[[test]]
name = "upstream"
harness = false

[lints]
workspace = true
