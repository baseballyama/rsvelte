[package]
name = "rsvelte_svelte_lint_typed"
description = "Svelte lint rules that require type information"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
rsvelte_plugin_interface.workspace = true
serde.workspace = true
rsvelte_kernel.workspace = true
rsvelte_lint_runner.workspace = true
rsvelte_svelte.workspace = true
rsvelte_svelte_lint.workspace = true
rsvelte_typescript.workspace = true
rsvelte_typescript_check.workspace = true

[dev-dependencies]
rsvelte_test_harness.workspace = true
rsvelte_kernel = { workspace = true, features = ["trace-artifacts"] }
rsvelte_markup.workspace = true

[[test]]
name = "rules"
harness = false

[lints]
workspace = true
